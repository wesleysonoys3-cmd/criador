<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Web - Teste de Botão</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md text-center max-w-sm w-full">
    <h1 id="welcome-title" class="text-2xl font-bold mb-4 text-gray-800">Bem-vindo ao Sistema</h1>
    <p id="statusText" class="text-gray-600 mb-6">Clique no botão abaixo para testar a interatividade.</p>
    <button id="actionBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200 w-full">
      Clique aqui
    </button>
  </div>

  <script>
    const btn = document.getElementById('actionBtn');
    const statusText = document.getElementById('statusText');

    btn.addEventListener('click', () => {
      btn.textContent = 'Clicado!';
      btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
      btn.classList.add('bg-green-600', 'hover:bg-green-700');
      statusText.textContent = 'O botão foi acionado com sucesso!';
    });
  </script>
</body>
</html>
