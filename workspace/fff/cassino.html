<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Game - Protótipo Casual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-b from-amber-900 via-yellow-950 to-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/90 border-4 border-yellow-500 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
        <!-- Header / Saldo -->
        <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl border border-yellow-500/50">
            <div>
                <span class="text-xs text-yellow-400 font-bold uppercase tracking-wider">Saldo Disponível</span>
                <div class="text-2xl font-extrabold text-yellow-300" id="balance">R$ 1.000,00</div>
            </div>
            <button onclick="addCredits()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-3 py-2 rounded-xl font-bold text-sm transition transform active:scale-95 shadow">
                <i class="fa-solid fa-plus"></i> Recarregar
            </button>
        </div>

        <!-- Área do Jogo (Slots 3x3) -->
        <div class="grid grid-cols-3 gap-3 mb-6 bg-slate-950 p-4 rounded-2xl border-2 border-amber-500/40 shadow-inner">
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-0">🐯</div>
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-1">🪙</div>
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-2">⭐</div>
            
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-3">💎</div>
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-4">🐯</div>
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-5">🪙</div>
            
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-6">⭐</div>
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-7">💎</div>
            <div class="slot bg-slate-900 border-2 border-yellow-600 rounded-xl h-24 flex items-center justify-center text-4xl shadow-lg transition" id="slot-8">🐯</div>
        </div>

        <!-- Mensagem de Vitória/Status -->
        <div id="message" class="text-center font-bold text-yellow-400 mb-4 h-6 text-lg">
            Boa sorte! Aperte Girar!
        </div>

        <!-- Controles de Aposta -->
        <div class="flex items-center justify-between mb-6 bg-slate-800/80 p-3 rounded-xl border border-slate-700">
            <span class="text-sm font-semibold text-slate-300">Valor da Aposta:</span>
            <div class="flex items-center space-x-2">
                <button onclick="changeBet(-5)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded-lg font-bold">-</button>
                <span id="bet-amount" class="font-bold text-yellow-400 w-16 text-center">R$ 10,00</span>
                <button onclick="changeBet(5)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded-lg font-bold">+</button>
            </div>
        </div>

        <!-- Botão Girar -->
        <button id="spin-btn" onclick="spin()" class="w-full bg-gradient-to-r from-yellow-500 via-amber-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-slate-950 font-extrabold text-xl py-4 rounded-2xl shadow-xl transition transform active:scale-95 border-2 border-yellow-300">
            <i class="fa-solid fa-rotate mr-2"></i> GIRAR AGORA!
        </button>
    </div>

    <script>
        let balance = 1000.00;
        let bet = 10.00;
        const symbols = ['🐯', '🪙', '⭐', '💎', '🔥', '🍊'];

        function updateUI() {
            document.getElementById('balance').innerText = `R$ ${balance.toFixed(2).replace('.', ',')}`;
            document.getElementById('bet-amount').innerText = `R$ ${bet.toFixed(2).replace('.', ',')}`;
        }

        function changeBet(amount) {
            bet += amount;
            if (bet < 2.00) bet = 2.00;
            if (bet > balance) bet = balance;
            updateUI();
        }

        function addCredits() {
            balance += 500.00;
            updateUI();
            document.getElementById('message').innerText = "Créditos adicionados! 💰";
        }

        function spin() {
            if (balance < bet) {
                document.getElementById('message').innerText = "Saldo insuficiente! Recarregue.";
                return;
            }

            balance -= bet;
            updateUI();

            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            document.getElementById('message').innerText = "Girando...";

            // Efeito de animação rápida
            let counter = 0;
            const interval = setInterval(() => {
                for (let i = 0; i < 9; i++) {
                    const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById(`slot-${i}`).innerText = randomSym;
                }
                counter++;
                if (counter > 10) {
                    clearInterval(interval);
                    finalizeSpin();
                }
            }, 100);
        }

        function finalizeSpin() {
            // Resultado final aleatório com pequena chance de ganho
            const finalSymbols = [];
            for (let i = 0; i < 9; i++) {
                const sym = symbols[Math.floor(Math.random() * symbols.length)];
                finalSymbols.push(sym);
                document.getElementById(`slot-${i}`).innerText = sym;
            }

            // Checar vitória simples (linha do meio com 3 iguais ou tigre no meio)
            let win = 0;
            if (finalSymbols[3] === finalSymbols[4] && finalSymbols[4] === finalSymbols[5]) {
                win = bet * 10;
            } else if (finalSymbols[4] === '🐯') {
                win = bet * 5;
            }

            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = false;

            if (win > 0) {
                balance += win;
                document.getElementById('message').innerHTML = `<span class="text-emerald-400">🎉 VOCÊ GANHOU R$ ${win.toFixed(2).replace('.', ',')}! 🎉</span>`;
            } else {
                document.getElementById('message').innerText = "Não foi dessa vez! Tente novamente.";
            }
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
