<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Vaga - Portal de Empregos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-blue-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <span>📄</span> Portal de Empregos
      </h1>
      <a href="index.html" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition">← Voltar às Vagas</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
    <div id="vagaDetalhe" class="bg-white rounded-xl shadow-md p-8 mb-8">
      <p class="text-gray-500 text-center py-8">Carregando detalhes da vaga...</p>
    </div>

    <!-- Formulário de Envio de Currículo -->
    <div class="bg-white rounded-xl shadow-md p-8">
      <h3 class="text-2xl font-bold text-gray-900 mb-6">Enviar Currículo (PDF)</h3>
      <div id="mensagemStatus" class="hidden mb-4 p-4 rounded-lg font-medium"></div>
      <form id="formCandidatura" onsubmit="enviarCurriculo(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
          <input type="text" id="nome" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Telefone / WhatsApp</label>
          <input type="text" id="telefone" required placeholder="(00) 00000-0000" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Currículo em PDF (Máx 5MB)</label>
          <input type="file" id="curriculo" accept="application/pdf" required class="w-full px-4 py-2 border rounded-lg bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow">
          Enviar Candidatura
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-6 mt-auto">
    <p>&copy; 2025 Portal de Empregos e Currículos. Todos os direitos reservados.</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const vagaId = urlParams.get('id');

    if (!vagaId) {
      window.location.href = 'index.html';
    }

    async function carregarVaga() {
      try {
        const res = await fetch(`/api/vagas/${vagaId}`);
        if (!res.ok) throw new Error('Vaga não encontrada');
        const v = await res.json();

        document.getElementById('vagaDetalhe').innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <span class="text-sm font-semibold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">${v.empresa_nome}</span>
            <span class="text-sm text-gray-500">Publicado em ${new Date(v.criado_em).toLocaleDateString('pt-BR')}</span>
          </div>
          <h2 class="text-3xl font-bold text-gray-900 mb-2">${v.titulo}</h2>
          <p class="text-md text-gray-600 mb-6">📍 Local: <strong>${v.local}</strong></p>
          <div class="mb-6">
            <h4 class="text-lg font-bold text-gray-800 mb-2">Descrição da Vaga</h4>
            <p class="text-gray-700 whitespace-pre-line">${v.descricao}</p>
          </div>
          <div>
            <h4 class="text-lg font-bold text-gray-800 mb-2">Requisitos e Qualificações</h4>
            <p class="text-gray-700 whitespace-pre-line">${v.requisitos}</p>
          </div>
        `;
      } catch (err) {
        document.getElementById('vagaDetalhe').innerHTML = '<p class="text-red-500 text-center py-4">Vaga não encontrada ou erro ao carregar.</p>';
      }
    }

    async function enviarCurriculo(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('mensagemStatus');
      
      const formData = new FormData();
      formData.append('nome_candidato', document.getElementById('nome').value);
      formData.append('email_candidato', document.getElementById('email').value);
      formData.append('telefone', document.getElementById('telefone').value);
      formData.append('curriculo', document.getElementById('curriculo').files[0]);

      statusDiv.className = "mb-4 p-4 rounded-lg font-medium bg-blue-100 text-blue-700";
      statusDiv.textContent = "Enviando currículo...";
      statusDiv.classList.remove('hidden');

      try {
        const res = await fetch(`/api/vagas/${vagaId}/candidatar`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (res.ok) {
          statusDiv.className = "mb-4 p-4 rounded-lg font-medium bg-green-100 text-green-700";
          statusDiv.textContent = "✅ Currículo enviado com sucesso! Boa sorte!";
          document.getElementById('formCandidatura').reset();
        } else {
          throw new Error(data.error || 'Erro ao enviar currículo.');
        }
      } catch (err) {
        statusDiv.className = "mb-4 p-4 rounded-lg font-medium bg-red-100 text-red-700";
        statusDiv.textContent = "❌ " + err.message;
      }
    }

    carregarVaga();
  </script>
</body>
</html>
